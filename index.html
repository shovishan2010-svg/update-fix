<!DOCTYPE html>
<html lang="en">

    <style>
        body {
            font-family: monospace;
            background-color: #000000;
            color: #ff0000;
            padding: 15px;
            margin: 0;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
            user-select: none;
        }
        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 15px;
            animation: glitch 0.1s infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); color: #ff0000; }
            20% { transform: translate(-2px, 2px); color: #ffff00; }
            40% { transform: translate(-2px, -2px); color: #ff0000; }
            60% { transform: translate(2px, 2px); color: #00ff00; }
            80% { transform: translate(2px, -2px); color: #ff0000; }
            100% { transform: translate(0); color: #ff0000; }
        }
        .terminal {
            background: #0a0a0a;
            border: 2px solid #ff0000;
            padding: 10px;
            height: 150px;
            overflow: hidden;
            font-size: 0.75rem;
            color: #00ff00;
            line-height: 1.3;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        .alert-box {
            border: 2px dashed #ffff00;
            padding: 10px;
            background: rgba(255, 255, 0, 0.1);
            text-align: center;
            margin-bottom: 15px;
            border-radius: 4px;
            color: #ffff00;
        }
        .btn-trap {
            display: block;
            width: 100%;
            padding: 16px;
            background-color: #ff0000;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            text-align: center;
            box-shadow: 0 0 25px #ff0000;
            cursor: pointer;
        }
    </style>
</head>

</html>
